[package]
name = "agentchattr-wrapper"
version = "0.1.0"
edition = "2021"
description = "Native cross-platform wrapper that hosts an agent CLI in a pseudo-terminal and bridges it to the agentchattr server."

[[bin]]
name = "agentchattr-wrapper"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.103"
crossterm = "0.29.0"
ctrlc = "3.5.2"
portable-pty = "0.9.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tiny_http = "0.12.0"
toml = "1.1.2"
ureq = { version = "3.3.0", default-features = false, features = ["json"] }
which = "8.0.4"
